<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dial Queue</title>
<style>
:root{--bg:#fbf8f4;--card:#fff;--ink:#22201d;--mute:#776f66;--line:#eadfd3;--acc:#f07a1a;--accd:#c85d0a;--red:#e5322d;--sel:#fff0e2;--hit:#ffe1c2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif}
header{padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid var(--line);background:var(--card)}
h1{font-size:18px;margin:0 8px 0 0;color:var(--accd)}
button{font:inherit;border:1px solid var(--line);background:var(--card);padding:8px 12px;border-radius:8px;color:var(--ink)}
button.go{background:var(--acc);color:#fff;border-color:var(--acc)}
button.rec{background:var(--red);color:#fff;border-color:var(--red)}
button:disabled{opacity:.4}
label{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:4px}
input,select{font:inherit;padding:6px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
input[type=number]{width:72px}
main{padding:20px 16px;max-width:900px;margin:0 auto}
#queue{display:flex;flex-direction:column;gap:6px}
.qline{display:flex;gap:4px;align-items:stretch}
.rh{width:28px;flex:none;padding:0;border:0;border-radius:8px;color:#fff;font-size:11px;font-weight:700;writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:.5px}
.qrow{flex:1;min-width:0;position:relative;display:grid;border:2px solid var(--acc);border-radius:8px;background:var(--card);overflow:hidden}
.qrow.muted{opacity:.4}
.head{position:absolute;top:0;bottom:0;width:3px;background:var(--red);left:0;pointer-events:none;z-index:2}
.blk{border-right:1px solid var(--acc);padding:6px 1px;text-align:center;cursor:pointer;min-width:0}
.blk:last-of-type{border-right:0}
.blk.sel{box-shadow:inset 0 0 0 3px var(--accd)}
.blk.hit{background:var(--hit)!important}
.blk.none svg{opacity:.45}
.blk svg{width:100%;max-width:60px;height:auto;display:block;margin:0 auto}
.blk .nm{font-size:10px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#spin{margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
#spin svg{width:280px;max-width:100%;display:block;margin:0 auto 12px}
#lever{cursor:pointer}
#rowbar{display:flex;gap:8px;margin-top:14px}
#ed{margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
.ttl{font-weight:600;font-size:16px}
.lane{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lane input.vals{flex:1;min-width:140px}
.lane .now{font-size:12px;color:var(--accd);min-width:64px}
#bw svg{width:220px;max-width:100%;display:block;margin:0 auto 10px}
.info{width:16px;height:16px;padding:0;border-radius:50%;font-weight:700;color:#9a9188;border-color:#cfc4b8;font-size:9px;line-height:1;flex:none}
#burger{margin-left:auto;font-size:18px;line-height:1;padding:6px 10px}
#rowbar,#ed,#spin,#toys{zoom:.8}
#toys{margin-top:28px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.toygrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.toy{border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.tsvg svg{width:100%;max-width:240px;cursor:pointer}
.tsvg .fx{opacity:0;transition:opacity .08s}
.tsvg.on .fx{opacity:1}
.tname{font-weight:600}
.tera{font-size:12px;color:var(--mute);margin-bottom:6px}
#rowbar{margin-top:20px}#ed{margin-top:28px}#spin{margin-top:28px}
.saved{display:flex;gap:6px;align-items:center;margin-bottom:6px}.saved span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sechead{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px;color:var(--mute)}
#infobox,.sheet{position:fixed;inset:0;background:rgba(34,32,29,.35);display:flex;align-items:flex-end;justify-content:center;z-index:10}
#infobox[hidden],.sheet[hidden]{display:none}
.ibody{background:var(--card);width:100%;max-width:640px;max-height:80vh;overflow:auto;border-radius:14px 14px 0 0;padding:18px 16px 24px;font-size:15px;line-height:1.55}
.ibody p{margin:0 0 12px}
.ibody .ttl{display:block;margin-bottom:10px;color:var(--accd)}
.rp{display:block;width:100%;text-align:left;margin-bottom:6px;border-left-width:6px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin:0 4px 0 10px;vertical-align:-1px}
</style>
</head>
<body>
<header>
<h1>Dial Queue</h1>
<button id="play" class="go">Play</button>
<button id="rec">Rec</button>
<label>Bounce <select id="blen"><option value="15">15s</option><option value="30" selected>30s</option><option value="60">60s</option></select></label><button id="bounce">Bounce</button>
<label>BPM <input id="bpm" type="number" min="40" max="300"></label>
<label>Step <select id="div"><option value="1">1/4</option><option value="2">1/8</option><option value="4">1/16</option></select></label>
<label>Preset <select id="pre"></select></label>
<label>Launch <select id="qn"><option value="0">Now</option><option value="0.25">Beat</option><option value="1">Bar</option><option value="2">2 bars</option><option value="4">4 bars</option></select></label>
<span id="qst" style="font-size:13px;font-weight:600;color:var(--accd)"></span>
<button class="info" data-topic="top">i</button>
<button id="burger" aria-label="Menu">&#9776;</button>
</header>
<main>
<div class="sechead"><button class="info" data-topic="rows">i</button></div>
<div id="queue"></div>
<div id="rowbar"><button id="addrow">Add row</button></div>
<div id="spin"></div>
<div id="toys"></div>
<div id="ed"></div>
</main>
<div id="menu" class="sheet" hidden><div class="ibody"><span class="ttl">Menu</span>
<div class="row"><input id="svname" placeholder="Preset name" style="flex:1;min-width:0"><button id="svbtn" class="go">Save</button></div>
<div id="svlist"></div>
<div class="row"><button id="rst">Reset wheels</button><button id="clr">Clear</button><button id="mclose">Close</button></div></div></div>
<div id="rowpick" class="sheet" hidden><div class="ibody"><span class="ttl" id="rpt"></span><div id="rpfam" class="row"></div><div id="rplist"></div><div class="row"><button id="rpempty">Empty row</button><button id="rpclose" class="go">Close</button></div></div></div>
<div id="infobox" hidden><div class="ibody"><div id="itxt"></div><button id="iclose" class="go">Close</button></div></div>
<script>
const FX={echo:{min:0,max:100,def:0,u:'%'},room:{min:0,max:100,def:0,u:'%'},spread:{min:0,max:100,def:0,u:'%'},tremolo:{min:0,max:100,def:0,u:'%'},tremrate:{min:1,max:30,def:8,u:'Hz'},filter:{min:0,max:100,def:100,u:'%'},reso:{min:0,max:30,def:1,u:'Q'},pitch:{min:-24,max:24,def:0,u:'st'},volume:{min:0,max:150,def:100,u:'%'},pan:{min:-100,max:100,def:0,u:''},drive:{min:0,max:100,def:0,u:'%'},decay:{min:10,max:400,def:100,u:'%'},tone:{min:0,max:100,def:50,u:''},gate:{min:0,max:1000,def:0,u:'ms'},chance:{min:0,max:100,def:100,u:'%'},advance:{min:0,max:64,def:1,u:''},ratchet:{min:1,max:16,def:1,u:'x'},span:{min:1,max:16,def:1,u:' steps'},accel:{min:-90,max:90,def:0,u:''},fall:{min:0,max:90,def:0,u:'%'},rpitch:{min:-12,max:12,def:0,u:'st'}};

wineglass:{f:1320,r:[1,2.32,4.25],a:[1,.35,.12],d:[2.6,1.4,.6],c:9000},bottle:{f:330,r:[1,2.8,5.1],a:[1,.25,.1],d:[.35,.15,.08],c:1800},chime:{f:1046,r:[1,2.76,5.40,8.93],a:[1,.5,.3,.15],d:[3,2,1.2,.6],c:9000},
block:{f:900,r:[1,2.67,4.12],a:[1,.4,.2],d:[.08,.04,.03],c:4000},marimba:{f:262,r:[1,3.93,9.8],a:[1,.25,.08],d:[.9,.2,.08],c:1500},clave:{f:2500,r:[1,2.1],a:[1,.3],d:[.07,.03],c:5000},
bell:{f:523,r:[.5,1,1.19,1.56,2,2.51],a:[.6,1,.7,.5,.6,.3],d:[3,2.5,2,1.6,1.2,1],c:6000},cup:{f:990,r:[1,1.59,2.14],a:[1,.6,.3],d:[.35,.25,.15],c:6000},plate:{f:520,r:[1,1.47,2.09,2.56,3.2],a:[1,.8,.6,.4,.3],d:[.9,.7,.5,.4,.3],c:5000}};

const MAXROWS=6,MAXLEN=16;
function L(fx,mode,a,b){return mode==='list'?{fx,mode,vals:a,from:FX[fx].min,to:FX[fx].max,sr:0,sb:0}:{fx,mode,vals:'',from:a,to:b,sr:0,sb:0}}
function F(fx,sr,sb,a,b){return{fx,mode:'follow',vals:'',from:a,to:b,sr,sb}}
function sg(sound,notches,lanes){return{sound:sound||'none',notches:notches||1,pos:0,lanes:lanes||[]}}
function row(map,len,choke){const a=[];for(let i=0;i<MAXLEN;i++)a.push(map[i]||sg('none'));return{mute:false,choke:!!choke,len:len||8,segs:a}}
function dnbRows(){return[
 row({0:sg('kick'),2:sg('kick',2,[L('volume','list','0,100')])}),
 row({4:sg('snare',1,[L('room','list','15')]),7:sg('snare',4,[L('volume','list','0,35,0,55'),L('decay','list','60')])}),
 row({0:sg('hat',1,[L('volume','list','80')]),1:sg('hat',2,[L('volume','list','30,50'),L('pan','list','-40,40')]),2:sg('hat',1,[L('volume','list','80')]),3:sg('hat',3,[L('volume','list','30,45,60'),L('ratchet','list','1,1,2')]),4:sg('hat',1,[L('volume','list','70')]),5:sg('hat',2,[L('volume','list','35,50')]),6:sg('openhat',2,[L('volume','list','60,40'),L('decay','list','80,140')]),7:sg('hat',4,[L('volume','list','40'),L('ratchet','list','1,1,1,3'),L('accel','list','40')])},8,true),

function hats16(v,ex){const m={};v.forEach((x,i)=>{m[i]=sg('hat',1,[L('volume','list',String(x)),L('pan','list',i%2?'20':'-20')])});return Object.assign(m,ex||{})}
function K4(f){const m={};[0,4,8,12].forEach(i=>m[i]=sg('kick',1,f?f():[]));return m}
function OFB(f){const m={};[2,6,10,14].forEach((i,k)=>m[i]=f(k));return m}
function OHATS(v){return row(Object.assign(hats16(v||[35,25,0,25,35,25,0,25,35,25,0,25,35,25,0,30]),OFB(()=>sg('openhat',1,[L('volume','list','55'),L('decay','list','70')]))),16,true)}
function CLAP(rm){return row({4:sg('clap',1,[L('room','list',rm||'25')]),12:sg('clap',1,[L('room','list',rm||'25')])},16)}
function ACID(){const n={0:'0',1:'12',2:'0',4:'3',5:'0',6:'15',7:'0',8:'0',10:'7',11:'0',12:'5',13:'17',14:'0',15:'10'},m={};for(const i in n)m[i]=sg('acid',8,[L('pitch','list',n[i]),L('tone','sine',10,95),L('volume','list',i%4==0?'90':'60'),L('decay','list',i%3==0?'140':'80')]);return row(m,16)}
function TGATE(){const m={};for(let i=0;i<16;i++)m[i]=sg('supersaw',4,[L('pitch','list','0,-4,-2,-7'),L('decay','list','15'),L('gate','list',i%2?'50':'90'),L('volume','list',String([70,30,50,30][i%4])),L('room','list','35')]);return row(m,16)}

function OBASS(){return row(OFB(()=>sg('bass',4,[L('pitch','list','0,-4,-2,-7'),L('decay','list','45'),L('filter','list','50')])),16)}
function WOB(){return row({0:sg('wobble',4,[L('tremrate','list','2,4,8,6'),L('pitch','list','0,0,-2,3'),L('decay','list','100')]),3:sg('wobble',2,[L('tremrate','list','12,8'),L('pitch','list','7,5'),L('decay','list','60')]),6:sg('wobble',4,[L('tremrate','list','6,3,16,4'),L('decay','list','80')]),11:sg('wobble',2,[L('tremrate','list','8'),L('pitch','list','-5,0'),L('decay','list','70')])},16)}

 Ceramic:{'Cups':()=>row({1:sg('cup',3,[L('pitch','list','0,2,5')]),3:sg('cup',2,[L('pitch','list','7,3'),L('volume','list','70')]),6:sg('cup',1,[L('pitch','list','12'),L('volume','list','60')])}),
  'Plate wash':()=>row({0:sg('plate',4,[L('ratchet','list','5,8,4,6'),L('span','list','4'),L('accel','list','15'),L('fall','list','12'),L('spread','list','50'),L('room','list','30')])}),
  'Tiles':()=>row({0:sg('ceramic'),3:sg('ceramic',3,[L('pitch','list','5,7,12'),L('volume','list','50')]),5:sg('ceramic',1,[L('pitch','list','-5')])},7)},
 Bass:{'Wobble':WOB,'Offbeat bass':OBASS,'Roller':()=>dnbRows()[3],

 else if(t.id==='nf'){const v=vseg(sel.r,sel.i);s.pos=(v.pos+1)%s.notches;s._pt=1;save()}
 else if(t.id==='nb'){const v=vseg(sel.r,sel.i);s.pos=(v.pos-1+s.notches)%s.notches;s._pt=1;save()}
 else if(t.id==='n0'){s.pos=0;s._pt=1;save()}
 else if(t.id==='choke'){rw.choke=!rw.choke;refreshAll()}
 else if(t.id==='mute'){rw.mute=!rw.mute;refreshAll()}
 else if(t.id==='delrow'){if(S.rows.length>1){rebase=true;S.rows.splice(sel.r,1);S.rows.forEach(x=>x.segs.forEach(g=>g.lanes.forEach(l=>{if(l.mode==='follow'&&l.sr>=S.rows.length)l.sr=0})));fixSel();refreshAll()}}
 else if(t.dataset.k==='del'){s.lanes.splice(+t.closest('.lane').dataset.l,1);refreshAll()}});
const SPN=document.getElementById('spin');
SPN.addEventListener('click',e=>{const t=e.target,sp=S.spin;
 if(t.id==='spon'){sp.on=!sp.on;renderSpin();save()}
 else if(t.id==='spnar'){sp.narr=!sp.narr;renderSpin();save()}
 else if(t.id==='spull'||t.closest('#lever')){initAudio();ac.resume();spinFire(ac.currentTime+.05);save()}});
SPN.addEventListener('change',e=>{const t=e.target,sp=S.spin;
 if(t.id==='spmode'){sp.mode=t.value;renderSpin()}else if(t.id==='spani')sp.animal=+t.value;save()});
SPN.addEventListener('input',e=>{const t=e.target,sp=S.spin,v=parseInt(t.value);if(isNaN(v))return;
 if(t.id==='spev'&&v>=1&&v<=100)sp.every=v;else if(t.id==='sprep'&&v>=1&&v<=8)sp.reps=v;else if(t.id==='spvol'&&v>=0&&v<=150)sp.vol=v;save()});
document.getElementById('addrow').onclick=()=>{if(S.rows.length<MAXROWS){rebase=true;S.rows.push(row({}));sel={r:S.rows.length-1,i:0};refreshAll()}};
playB.onclick=()=>playing?stop():start();
recB.onclick=()=>{initAudio();ac.resume();if(!recording){recL=[];recR=[];recSrc.connect(recNode);recNode.connect(recZ);recording=true;recStart=Date.now();recB.classList.add('rec');if(!playing)start()}else{recording=false;try{recSrc.disconnect(recNode);recNode.disconnect()}catch(e){}recB.classList.remove('rec');recB.textContent='Rec';saveWav()}};
const bnB=document.getElementById('bounce');
bnB.onclick=async()=>{if(bnB.disabled)return;initAudio();if(playing)stop();const secs=+document.getElementById('blen').value,keep=JSON.stringify(S),live={ac,master,conv};bnB.disabled=true;bnB.textContent='Rendering...';
 try{const sr=live.ac.sampleRate,oc=new OfflineAudioContext(2,Math.ceil(sr*(secs+4)),sr);ac=oc;OFF=true;master=oc.createGain();master.gain.value=.7;const comp=oc.createDynamicsCompressor();master.connect(comp);comp.connect(oc.destination);conv=oc.createConvolver();conv.buffer=makeIR();conv.connect(master);lastGroup.length=0;
  LIVE=clone(S);G0=0;const sd=stepDur();let g=0;for(let t=.05;t<secs;t+=sd){stepAt(t,g);g++}
  const buf=await oc.startRendering();wavOut([buf.getChannelData(0)],[buf.getChannelData(1)],sr)}
 catch(e){alert('Bounce failed: '+e.message)}
 ac=live.ac;master=live.master;conv=live.conv;OFF=false;lastGroup.length=0;S=JSON.parse(keep);LIVE=S;bnB.disabled=false;bnB.textContent='Bounce';renderQueue();renderEd();renderSpin();renderToys()};
const QLAB={0:'step',0.25:'beat',1:'bar',2:'2 bars',4:'4 bars'},qnI=document.getElementById('qn'),qst=document.getElementById('qst');qnI.value=String(QN);qnI.onchange=()=>{QN=+qnI.value;try{localStorage.setItem('dialqueueQ',String(QN))}catch(e){}};
const bpmI=document.getElementById('bpm'),divI=document.getElementById('div'),preI=document.getElementById('pre');
const PGROUP={'Drum and bass':['Breakneck','Liquid steel','Neuro grit','Jungle tiles','Rollers','Halftime zoo','Tin rain','Prism'],EDM:['House','Peak techno','Acid line','Trance gate','Big room','Dubstep','Future bass','UK garage','Hardstyle','Trap'],Textures:[]};
Object.keys(PRESETS).forEach(k=>{if(!Object.values(PGROUP).some(a=>a.includes(k)))PGROUP.Textures.push(k)});
preI.innerHTML='<option value="">Custom</option>'+Object.entries(PGROUP).map(([g,a])=>`<optgroup label="${g}">${a.map(k=>`<option value="${k}">${k}</option>`).join('')}</optgroup>`).join('');
preI.value=S.preset||'';
preI.onchange=()=>{if(!preI.value){preI.value=S.preset||'';return}S=PRESETS[preI.value]();bpmI.value=S.bpm;divI.value=S.div;sel={r:0,i:0};rebase=true;refreshAll()};
bpmI.value=S.bpm;divI.value=S.div;
bpmI.oninput=()=>{const v=parseInt(bpmI.value);if(v>=40&&v<=300){S.bpm=v;save()}};
divI.onchange=()=>{S.div=+divI.value;rebase=true;save()};
document.getElementById('rst').onclick=()=>{S.rows.forEach(rw=>rw.segs.forEach(s=>{s.pos=0;s._pt=1}));save()};
document.getElementById('clr').onclick=()=>{rebase=true;S.rows=[row({})];S.preset='';preI.value='';sel={r:0,i:0};refreshAll()};
function setWheel(svg,seg){if(!svg)return;const key=seg.pos+'/'+seg.notches;if(svg._k===key)return;svg._k=key;const ind=svg.querySelector('.ind'),lbl=svg.querySelector('.lbl'),c=svg.viewBox.baseVal.width/2;ind.setAttribute('transform',`rotate(${seg.pos/seg.notches*360} ${c} ${c})`);lbl.textContent=`${seg.pos+1}/${seg.notches}`}
function vseg(r,i){if(playing){const L=LIVE.rows[r];if(L&&L.segs[i])return L.segs[i]}return S.rows[r].segs[i]}
function frame(){let h=null,fr=0,now=0;
 if(playing&&ac){now=ac.currentTime;while(hits.length>1&&hits[1].t<=now)hits.shift();if(hits[0]&&hits[0].t<=now){h=hits[0];fr=Math.min(1,(now-h.t)/stepDur())}}
 Q.querySelectorAll('.qrow').forEach(q=>{const r=+q.dataset.r,rw=playing?LIVE.rows[r]:S.rows[r];if(!rw)return;const st=h?h.g%rw.len:-1;if(h)q.querySelector('.head').style.left=`calc(${(st+fr)/rw.len*100}% - 1px)`;
  q.querySelectorAll('.blk').forEach(b=>{const i=+b.dataset.i,s=rw.segs[i];if(!s)return;setWheel(b.querySelector('svg'),s);const on=!!(h&&i===st&&now-h.t<.09&&!rw.mute&&s.sound!=='none');if(b._on!==on){b._on=on;b.classList.toggle('hit',on)}})});
 cur();const s=vseg(sel.r,sel.i);setWheel(document.querySelector('#bw svg'),s);
 const qt=dirty?'Queued, drops in on the next '+QLAB[QN]:'';if(qst.textContent!==qt)qst.textContent=qt;
 E.querySelectorAll('.lane').forEach(ln=>{const l=cur().lanes[+ln.dataset.l];if(l){const tx=`now ${Math.round(laneValue(l,s.pos,s.notches))}${FX[l.fx].u}`,el=ln.querySelector('.now');if(el.textContent!==tx)el.textContent=tx}});
 if(ac){while(spinQ.length&&spinQ[0].t<=ac.currentTime){const q=spinQ.shift();anim={from:spinAng,to:Math.ceil(spinAng/360)*360+720+q.i*45,st:performance.now()}}}
 if(anim){const p=Math.min(1,(performance.now()-anim.st)/900),e2=1-Math.pow(1-p,3);spinAng=anim.from+(anim.to-anim.from)*e2;const ar=document.getElementById('arrow'),lv=document.getElementById('lever');if(ar)ar.setAttribute('transform',`rotate(${spinAng%360} 135 130)`);if(lv)lv.setAttribute('transform',`translate(0 ${(Math.sin(Math.min(1,p*3)*Math.PI)*110).toFixed(1)})`);if(p>=1){anim=null;spinAng%=360}}
 if(ac){while(toyQ.length&&toyQ[0].t<=ac.currentTime){const q=toyQ.shift();const el=document.querySelector(`.tsvg[data-fire="${q.id}"]`);if(el){el.classList.add('on');clearTimeout(el._tm);el._tm=setTimeout(()=>el.classList.remove('on'),q.id==='spark'?520:320)}}}
 if(recording)recB.textContent=`Stop rec ${Math.floor((Date.now()-recStart)/1000)}s`;
 requestAnimationFrame(frame)}
const INFO={
top:['Top controls',['Play starts and stops the pattern.','Rec records everything you hear. Tap it again to stop, and it saves a WAV file to your phone. It starts playback if nothing is playing.','Bounce builds the pattern offline, faster than it plays, and saves a WAV file of the length you pick. It never stutters, even on the heaviest patterns. The wheels go back to where they were afterward.','Launch sets when changes drop in while playing. Every change you make, from a new preset to one notch or one effect value, waits in a queue and lands together on the next step, beat, bar, 2 bars or 4 bars, so the groove never breaks. The orange note next to it shows when something is waiting. When stopped, changes apply right away.','BPM sets the tempo, from 40 to 300.','Step sets how long each block lasts: a quarter, eighth or sixteenth note.','Preset loads a ready-made pattern. The menu shows which one is loaded. Custom means you started from Clear.','The menu button holds Save, your saved presets, Reset wheels and Clear. Save keeps the whole beat on this phone under the name you type. Load drops it in on the next launch point. Reset wheels turns every wheel back to notch 1. Clear empties everything down to one blank row.']],
toys:['Toy box',['Each toy brings back the sound of a real kind of toy from its era. Tap the toy or Fire to set it off.','The spark gun is the early 80s kind, where pulling the trigger spun a flint wheel against a ratchet inside a tin body, so you hear rapid clicks, crackling sparks and the tin ringing.','The laser gun is the mid 90s kind, with a chip and a tiny speaker playing a stored pew: a square wave diving in pitch with a fast warble, crunched down like a cheap speaker.','Every fires the toy on its own every so many bars while the beat plays. 0 turns that off.','Both sounds also live in the Toys family, so any block can use them with all the wheel assignments.']],
spinner:['Spinner',['Pull the lever or tap Pull, and the arrow spins and lands on an animal. The narrator names it, then the animal answers.','While the pattern plays, the spinner fires on its own every so many bars. Set Every from 1 to 100.','Random picks any animal. In order goes around the wheel. Same animal always lands on the one you choose.','Repeats plays the answer 1 to 8 times in a row. Volume runs 0 to 150.','The animal sounds land in Rec and Bounce. The narrator voice comes from your phone and plays live only.']],
rows:['Rows',['Each row is a line of blocks with its own red line. All rows play at the same time.','A row can be 1 to 16 blocks long. Rows of different lengths drift apart and line up again later, which keeps the pattern changing.','The wheel in each block shows its current notch out of its total. The color shows which sound is in the block.','Tap any block to edit it below. Add row adds up to 6 rows.','The colored bar on the left of each row shows its instrument family. Tap it to load a row preset: pick a family across the top, then a pattern. Only that row changes.']],
block:['Block and row settings',['Notches sets how many positions the wheel has, from 1 to 360.','Each time the red line crosses the block, it plays at the current notch, then the wheel turns. It turns 1 notch unless an advance assignment says otherwise.','Notch back, Notch forward and To notch 1 move the wheel by hand.','Row length, Choke, Mute row and Remove row change the whole row. Choke makes each new hit in the row stop the one before it, which sharpens the gaps.']],
assign:['Assignments',['Each assignment ties one setting to the wheel. A block can have as many as you want.','Step list cycles your values one per notch, like 10,20,30,40. Ramp moves from From to To across all the notches. Up and down climbs then falls. Smooth wave follows a curve. Random repeat picks values that repeat every cycle. Follow wheel reads another block\'s wheel position, so one wheel steers another.','Echo, room, tremolo, filter and drive run 0 to 100. Room is a short reverb. Spread scatters each repeat across left and right. Tremrate is 1 to 30 Hz. Reso is 0 to 30. Pitch is -24 to 24 semitones. Volume is 0 to 150. Pan is -100 to 100. Decay is 10 to 400.','Tone sets how bright struck materials ring. Gate cuts each hit after that many milliseconds. Chance is the odds the block plays at all. Advance sets how many notches the wheel turns per pass, and 0 freezes it.','Ratchet repeats a hit up to 16 times inside the span, measured in steps. Accel above 0 squeezes the repeats together like a bouncing ball, and below 0 spreads them out. Fall lowers each repeat. Rpitch shifts each repeat in semitones.']],
sounds:['Sounds',['The first menu picks a family. The second picks the instrument inside it. Empty clears the block.','808 holds the drum machine voices. Glass, Wood, Metal and Ceramic are struck materials, each ringing with its own set of overtones. Bass holds low voices, including wobble, whose speed follows the tremrate assignment. Reed holds breathy wind voices. Synth holds stab, pluck, supersaw, acid and chord for EDM leads and pads. Toys holds the spark gun and laser gun. FX holds zaps, pings and sweeps. Animal holds moo, meow, bark, yip, quack, oink, baa, chirp and ribbit, all built from scratch like the rest.','Each family has its own color, and each instrument is a shade of it.','__legend__']]};
function legend(){return Object.entries(FAM).map(([f,l])=>`<span style="color:${FAMCOL[f]};font-weight:700">${f}</span>`+l.map(x=>`<span class="dot" style="background:${COL[x]}"></span>${x}`).join(' ')).join('<br>')}
const RP=document.getElementById('rowpick');let rpRow=0,rpFam='808';
function openPick(r){rpRow=r;const f=rowFam(S.rows[r]);rpFam=f==='Empty'?'808':f;drawPick();RP.hidden=false}
function drawPick(){document.getElementById('rpt').textContent=`Row ${rpRow+1} presets`;
 document.getElementById('rpfam').innerHTML=Object.keys(ROWLIB).map(f=>`<button data-f="${f}" style="border-color:${FAMCOL[f]};color:${f===rpFam?'#fff':FAMCOL[f]};background:${f===rpFam?FAMCOL[f]:'#fff'}">${f}</button>`).join('');
 document.getElementById('rplist').innerHTML=Object.keys(ROWLIB[rpFam]).map(n=>`<button class="rp" data-n="${n}" style="border-left-color:${FAMCOL[rpFam]}">${n}</button>`).join('')}
RP.addEventListener('click',e=>{const t=e.target;if(t===RP||t.id==='rpclose'){RP.hidden=true;return}
 if(t.dataset.f){rpFam=t.dataset.f;drawPick();return}
 let nr=null;if(t.dataset.n)nr=ROWLIB[rpFam][t.dataset.n]();else if(t.id==='rpempty')nr=row({});
 if(nr){rebase=true;S.rows[rpRow]=nr;S.preset='';preI.value='';sel={r:rpRow,i:0};lastGroup.length=0;RP.hidden=true;refreshAll()}});
const MENU=document.getElementById('menu');
function loadSaved(){try{return JSON.parse(localStorage.getItem('dialqueueSaved'))||{}}catch(e){return{}}}
function drawSaved(){const sv=loadSaved(),ks=Object.keys(sv);document.getElementById('svlist').innerHTML=ks.length?ks.map(k=>`<div class="saved"><span>${k.replace(/</g,'&lt;')}</span><button data-load="${encodeURIComponent(k)}">Load</button><button data-del="${encodeURIComponent(k)}">Delete</button></div>`).join(''):'<p class="hint" style="font-size:13px;color:var(--mute)">Saved presets show here.</p>'}
document.getElementById('burger').onclick=()=>{drawSaved();MENU.hidden=false};
MENU.addEventListener('click',e=>{const t=e.target;if(t===MENU||t.id==='mclose'){MENU.hidden=true;return}
 if(t.id==='rst'||t.id==='clr'){MENU.hidden=true;return}
 if(t.id==='svbtn'){const n=document.getElementById('svname').value.trim();if(!n)return;const sv=loadSaved();sv[n]=clone(S);try{localStorage.setItem('dialqueueSaved',JSON.stringify(sv))}catch(err){}document.getElementById('svname').value='';drawSaved();return}
 if(t.dataset.load){const sv=loadSaved(),k=decodeURIComponent(t.dataset.load);if(sv[k]){S=clone(sv[k]);S.preset='';if(!S.spin)S.spin=spinDef();if(!S.toys)S.toys={spark:0,laser:0};preI.value='';bpmI.value=S.bpm;divI.value=S.div;sel={r:0,i:0};rebase=true;MENU.hidden=true;refreshAll()}return}
 if(t.dataset.del){const sv=loadSaved();delete sv[decodeURIComponent(t.dataset.del)];try{localStorage.setItem('dialqueueSaved',JSON.stringify(sv))}catch(err){}drawSaved()}},true);
const IB=document.getElementById('infobox'),IT=document.getElementById('itxt');
document.addEventListener('click',e=>{const b=e.target.closest('.info');if(!b)return;e.stopPropagation();const [t,ps]=INFO[b.dataset.topic];IT.innerHTML=`<span class="ttl">${t}</span>`+ps.map(p=>`<p>${p==='__legend__'?legend():p}</p>`).join('');IB.hidden=false},true);
document.getElementById('iclose').onclick=()=>{IB.hidden=true};
IB.addEventListener('click',e=>{if(e.target===IB)IB.hidden=true});
const TB=document.getElementById('toys');
TB.addEventListener('click',e=>{const f=e.target.closest('[data-fire]');if(!f)return;initAudio();ac.resume();toyFire(f.dataset.fire,ac.currentTime+.02)});
TB.addEventListener('input',e=>{const t=e.target;if(!t.dataset.every)return;const v=parseInt(t.value);if(v>=0&&v<=100){S.toys[t.dataset.every]=v;save()}});
renderQueue();renderEd();renderSpin();renderToys();requestAnimationFrame(frame);
</script>
