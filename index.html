<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dial Queue</title>
<style>
:root{--bg:#fbf8f4;--card:#fff;--ink:#22201d;--mute:#776f66;--line:#eadfd3;--acc:#f07a1a;--accd:#c85d0a;--red:#e5322d;--sel:#fff0e2;--hit:#ffe1c2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif}
header{padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid var(--line);background:var(--card)}
h1{font-size:18px;margin:0 8px 0 0;color:var(--accd)}
button{font:inherit;border:1px solid var(--line);background:var(--card);padding:8px 12px;border-radius:8px;color:var(--ink)}
button.go{background:var(--acc);color:#fff;border-color:var(--acc)}
button:disabled{opacity:.4}
label{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:4px}
input,select{font:inherit;padding:6px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
input[type=number]{width:72px}
main{padding:24px 16px;max-width:900px;margin:0 auto}
#queue{position:relative;display:flex;flex-direction:column;gap:6px}
.qrow{display:grid;grid-template-columns:repeat(8,1fr);border:2px solid var(--acc);border-radius:8px;background:var(--card);overflow:hidden}
.qrow.muted{opacity:.4}
.blk{border-right:1px solid var(--acc);padding:6px 2px;text-align:center;cursor:pointer;min-width:0}
.blk:last-child{border-right:0}
.blk.sel{background:var(--sel)}
.blk.hit{background:var(--hit)}
.blk svg{width:100%;max-width:60px;height:auto;display:block;margin:0 auto}
.blk .nm{font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#head{position:absolute;top:-8px;bottom:-8px;width:3px;background:var(--red);left:0;pointer-events:none;border-radius:2px;z-index:2}
#rowbar{display:flex;gap:8px;margin-top:14px}
#ed{margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
.ttl{font-weight:600;font-size:16px}
.lane{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lane input.vals{flex:1;min-width:140px}
.lane .now{font-size:12px;color:var(--accd);min-width:64px}
#bw svg{width:220px;max-width:100%;display:block;margin:0 auto 10px}
.hint{font-size:12px;color:var(--mute);line-height:1.5;margin:10px 0 0}
</style>
</head>
<body>
<header>
<h1>Dial Queue</h1>
<button id="play" class="go">Play</button>
<label>BPM <input id="bpm" type="number" min="40" max="300"></label>
<label>Step <select id="div"><option value="1">1/4</option><option value="2">1/8</option><option value="4">1/16</option></select></label>
<label>Preset <select id="pre"></select></label>
<button id="rst">Reset wheels</button>
<button id="clr">Clear</button>
</header>
<main>
<div id="queue"></div>
<div id="rowbar"><button id="addrow">Add row</button></div>
<div id="ed"></div>
</main>
<script>
const FX={echo:{min:0,max:100,def:0,u:'%'},tremolo:{min:0,max:100,def:0,u:'%'},tremrate:{min:1,max:30,def:8,u:'Hz'},filter:{min:0,max:100,def:100,u:'%'},reso:{min:0,max:30,def:1,u:'Q'},pitch:{min:-24,max:24,def:0,u:'st'},volume:{min:0,max:150,def:100,u:'%'},pan:{min:-100,max:100,def:0,u:''},drive:{min:0,max:100,def:0,u:'%'},decay:{min:10,max:400,def:100,u:'%'},ratchet:{min:1,max:16,def:1,u:'x'},span:{min:1,max:16,def:1,u:' steps'},accel:{min:-90,max:90,def:0,u:''},fall:{min:0,max:90,def:0,u:'%'},rpitch:{min:-12,max:12,def:0,u:'st'}};
const SOUNDS=['kick','snare','hat','openhat','clap','tom','rim','cowbell','bass','ping','ball','zap','none'];
const MODES={list:'Step list',ramp:'Ramp',tri:'Up and down',sine:'Smooth wave',rand:'Random repeat'};
const MAXROWS=6;
function L(fx,mode,a,b){return mode==='list'?{fx,mode,vals:a,from:FX[fx].min,to:FX[fx].max}:{fx,mode,vals:'',from:a,to:b}}
function sg(sound,notches,lanes){return{sound:sound||'none',notches:notches||1,pos:0,lanes:lanes||[]}}
function row(map){const a=[];for(let i=0;i<8;i++)a.push(map[i]||sg('none'));return{mute:false,segs:a}}
function dnbRows(){return[
 row({0:sg('kick'),2:sg('kick',2,[L('volume','list','0,100')])}),
 row({4:sg('snare'),7:sg('snare',4,[L('volume','list','0,35,0,55'),L('decay','list','60')])}),
 row({0:sg('hat',1,[L('volume','list','80')]),1:sg('hat',2,[L('volume','list','30,50'),L('pan','list','-40,40')]),2:sg('hat',1,[L('volume','list','80')]),3:sg('hat',3,[L('volume','list','30,45,60'),L('ratchet','list','1,1,2')]),4:sg('hat',1,[L('volume','list','70')]),5:sg('hat',2,[L('volume','list','35,50')]),6:sg('openhat',2,[L('volume','list','60,40'),L('decay','list','80,140')]),7:sg('hat',4,[L('volume','list','40'),L('ratchet','list','1,1,1,3'),L('accel','list','40')])}),
 row({0:sg('bass',4,[L('pitch','list','0,0,3,-2'),L('decay','list','160'),L('filter','list','55')]),3:sg('bass',2,[L('pitch','list','-5,7'),L('volume','list','70'),L('decay','list','70'),L('filter','list','50')])})]}
const PRESETS={
 'Boom bop':()=>({bpm:110,div:2,rows:[row({0:sg('kick',4,[L('echo','list','10,20,30,40')]),1:sg('kick'),2:sg('snare',8,[L('tremolo','tri',0,80)]),3:sg('kick'),4:sg('kick'),5:sg('kick'),6:sg('kick'),7:sg('kick')})]}),
 'Breakneck':()=>({bpm:174,div:4,rows:dnbRows()}),
 'Steel ball':()=>({bpm:100,div:2,rows:[
  row({0:sg('ball',4,[L('ratchet','list','10,14,8,16'),L('span','list','8'),L('accel','list','22,18,25,15'),L('fall','list','9'),L('pitch','list','0,2,-1,3'),L('echo','list','15'),L('filter','ramp',100,70)])}),
  row({0:sg('kick',1,[L('volume','list','70'),L('decay','list','150')]),4:sg('kick',2,[L('volume','list','0,60')])})]}),
 'Pin drop':()=>({bpm:90,div:2,rows:[
  row({0:sg('ping',8,[L('ratchet','list','3,4,2,5'),L('span','list','2'),L('accel','list','55'),L('fall','list','35'),L('pitch','list','12,19,15,24'),L('echo','ramp',20,70),L('pan','sine',-60,60)]),5:sg('ping',2,[L('pitch','list','7,24'),L('ratchet','list','2'),L('accel','list','60'),L('fall','list','50'),L('echo','list','50')])}),
  row({2:sg('rim',2,[L('volume','list','50'),L('pan','list','-50,50'),L('decay','list','60')]),6:sg('rim',3,[L('volume','list','40,0,55')])}),
  row({0:sg('bass',4,[L('pitch','list','0,-2,3,-5'),L('decay','list','300'),L('filter','list','40')])})]}),
 'Prism':()=>{const r=dnbRows();r.push(row({0:sg('ball',8,[L('ratchet','ramp',4,16),L('span','list','8'),L('accel','list','20'),L('fall','list','10'),L('rpitch','list','0,0,1,-1'),L('volume','list','70'),L('echo','list','20')]),6:sg('ping',4,[L('volume','list','0,0,0,80'),L('pitch','list','24,19'),L('echo','list','60'),L('ratchet','list','3'),L('accel','list','60'),L('fall','list','40'),L('span','list','2')])}));return{bpm:174,div:4,rows:r}}};
let S=null;try{S=JSON.parse(localStorage.getItem('dialqueue2'))}catch(e){}
if(!S||!S.rows||!S.rows.length)S=PRESETS['Prism']();
function save(){try{localStorage.setItem('dialqueue2',JSON.stringify(S))}catch(e){}}
function clamp(v,f){return Math.max(f.min,Math.min(f.max,v))}
function laneValue(l,p,N){const f=FX[l.fx];let v;
 if(l.mode==='list'){const a=String(l.vals).split(/[ ,]+/).filter(x=>x!=='').map(Number).filter(x=>!isNaN(x));v=a.length?a[p%a.length]:f.def}
 else{const from=+l.from||0,to=+l.to||0;let t=0;
  if(l.mode==='ramp')t=N>1?p/(N-1):0;
  else if(l.mode==='tri'){const ph=p/N;t=ph<.5?ph*2:2-ph*2}
  else if(l.mode==='sine')t=.5-.5*Math.cos(2*Math.PI*p/N);
  else if(l.mode==='rand'){let h=((p+1)*2654435761)%4294967296;h=(h^(h>>>15))>>>0;t=(h%1000)/999}
  v=from+(to-from)*t}
 return clamp(v,f)}
function params(seg){const o={};for(const k in FX)o[k]=FX[k].def;for(const l of seg.lanes)o[l.fx]=laneValue(l,seg.pos,seg.notches);return o}

let ac=null,master=null,noise=null;
function initAudio(){if(ac)return;ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.7;const comp=ac.createDynamicsCompressor();master.connect(comp);comp.connect(ac.destination);const len=ac.sampleRate;noise=ac.createBuffer(1,len,ac.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1}
function env(g,t,peak,dec){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+.002);g.gain.exponentialRampToValueAtTime(0.0001,t+Math.max(.01,dec))}
function nz(t,dur){const s=ac.createBufferSource();s.buffer=noise;s.start(t);s.stop(t+dur);return s}
function osc(type,f,t,dur,out){const o=ac.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);o.connect(out);o.start(t);o.stop(t+dur);return o}
function voice(sound,t,P,out){const pm=Math.pow(2,P.pitch/12),dm=P.decay/100,g=ac.createGain();g.connect(out);
 if(sound==='kick'){const o=osc('sine',150*pm,t,.5*dm+.05,g);o.frequency.exponentialRampToValueAtTime(45*pm,t+.12);env(g,t,1,.45*dm)}
 else if(sound==='snare'){const n=nz(t,.3*dm+.05),hp=ac.createBiquadFilter();hp.type='highpass';hp.frequency.value=1200*pm;n.connect(hp);hp.connect(g);env(g,t,.8,.22*dm);const og=ac.createGain();og.connect(out);osc('triangle',185*pm,t,.2,og);env(og,t,.5,.1*dm)}
 else if(sound==='hat'||sound==='openhat'){const n=nz(t,.5*dm+.05),hp=ac.createBiquadFilter();hp.type='highpass';hp.frequency.value=Math.min(16000,7000*pm);n.connect(hp);hp.connect(g);env(g,t,.5,(sound==='hat'?.05:.35)*dm)}
 else if(sound==='clap'){const n=nz(t,.35*dm+.08),bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1500*pm;bp.Q.value=1.5;n.connect(bp);bp.connect(g);g.gain.setValueAtTime(0.0001,t);[0,.012,.024].forEach(x=>{g.gain.setValueAtTime(.9,t+x);g.gain.exponentialRampToValueAtTime(.1,t+x+.01)});g.gain.exponentialRampToValueAtTime(0.0001,t+.04+.2*dm)}
 else if(sound==='tom'){const o=osc('sine',220*pm,t,.4*dm+.05,g);o.frequency.exponentialRampToValueAtTime(110*pm,t+.25);env(g,t,.9,.35*dm)}
 else if(sound==='rim'){const bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1700*pm;bp.connect(g);osc('square',800*pm,t,.06,bp);env(g,t,.7,.04*dm)}
 else if(sound==='cowbell'){const bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=2000*pm;bp.connect(g);osc('square',540*pm,t,.4*dm+.05,bp);osc('square',800*pm,t,.4*dm+.05,bp);env(g,t,.5,.3*dm)}
 else if(sound==='bass'){const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=420;lp.connect(g);const d=.6*dm+.05;osc('sine',55*pm,t,d,lp);const sa=ac.createGain();sa.gain.value=.3;sa.connect(lp);osc('sawtooth',55*pm,t,d,sa).detune.value=8;env(g,t,.9,.55*dm)}
 else if(sound==='ping'){const f=880*pm,d=1.3*dm+.05,c=ac.createOscillator(),m=ac.createOscillator(),mg=ac.createGain();c.frequency.value=f;m.frequency.value=f*3.5;mg.gain.setValueAtTime(f*2,t);mg.gain.exponentialRampToValueAtTime(1,t+.4*dm+.01);m.connect(mg);mg.connect(c.frequency);c.connect(g);c.start(t);m.start(t);c.stop(t+d);m.stop(t+d);env(g,t,.35,1.2*dm)}
 else if(sound==='ball'){const d=.12*dm+.05;[1,1.52,2.31].forEach(x=>{const pg=ac.createGain();pg.gain.value=.3;pg.connect(g);osc('sine',2200*pm*x,t,d,pg)});const n=nz(t,.02),bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=5000;n.connect(bp);bp.connect(g);env(g,t,.6,.09*dm)}
 else if(sound==='zap'){const o=osc('sine',3000*pm,t,.15*dm+.05,g);o.frequency.exponentialRampToValueAtTime(80*pm,t+.12*dm+.01);env(g,t,.6,.14*dm)}}
function trigger(seg,t){if(seg.sound==='none')return;const P=params(seg),sd=stepDur(),span=Math.round(P.span)*sd;
 const pre=ac.createGain();let node=pre;
 if(P.drive>0){const ws=ac.createWaveShaper(),k=P.drive*2,c=new Float32Array(1024);for(let i=0;i<1024;i++){const x=i/511.5-1;c[i]=(1+k)*x/(1+k*Math.abs(x))}ws.curve=c;node.connect(ws);node=ws}
 const flt=ac.createBiquadFilter();flt.type='lowpass';flt.frequency.value=80*Math.pow(18000/80,P.filter/100);flt.Q.value=P.reso;node.connect(flt);
 const tr=ac.createGain(),dep=P.tremolo/100;tr.gain.value=1-dep/2;flt.connect(tr);
 if(dep>0){const lfo=ac.createOscillator();lfo.frequency.value=P.tremrate;const lg=ac.createGain();lg.gain.value=dep/2;lfo.connect(lg);lg.connect(tr.gain);lfo.start(t);lfo.stop(t+span+2)}
 const vol=ac.createGain();vol.gain.value=P.volume/100;tr.connect(vol);let last=vol;
 if(ac.createStereoPanner){const pan=ac.createStereoPanner();pan.pan.value=P.pan/100;vol.connect(pan);last=pan}
 last.connect(master);
 if(P.echo>0){const send=ac.createGain();send.gain.value=P.echo/100;const dl=ac.createDelay(4);dl.delayTime.value=.75*60/S.bpm;const fb=ac.createGain();fb.gain.value=.45;last.connect(send);send.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(master);setTimeout(()=>{try{fb.disconnect();dl.disconnect();send.disconnect()}catch(e){}},(t-ac.currentTime+span)*1000+6000)}
 const n=Math.round(P.ratchet),r=1-P.accel/100,w=[];let sum=0;for(let k=0;k<n;k++){const x=Math.pow(r,k);w.push(x);sum+=x}
 let off=0;for(let k=0;k<n;k++){const hg=ac.createGain();hg.gain.value=Math.pow(1-P.fall/100,k);hg.connect(pre);voice(seg.sound,t+off,Object.assign({},P,{pitch:P.pitch+P.rpitch*k}),hg);off+=w[k]/sum*span}}

let playing=false,nextT=0,step=0,timer=null,hits=[];
function stepDur(){return 60/S.bpm/S.div}
function tick(){while(nextT<ac.currentTime+.12){for(const rw of S.rows){const seg=rw.segs[step];if(!rw.mute)trigger(seg,nextT);seg.pos=(seg.pos+1)%seg.notches}hits.push({i:step,t:nextT});nextT+=stepDur();step=(step+1)%8}}
function start(){initAudio();ac.resume();nextT=ac.currentTime+.06;step=0;hits=[];timer=setInterval(tick,25);playing=true;playB.textContent='Stop'}
function stop(){clearInterval(timer);playing=false;playB.textContent='Play';save()}

const Q=document.getElementById('queue'),E=document.getElementById('ed'),playB=document.getElementById('play');
let sel={r:0,i:0};
function fixSel(){if(sel.r>=S.rows.length)sel.r=S.rows.length-1;if(sel.r<0)sel.r=0}
function wheelSVG(seg,big){const N=seg.notches,size=big?220:64,r=big?96:26,c=size/2;let s=`<svg viewBox="0 0 ${size} ${size}"><circle cx="${c}" cy="${c}" r="${r}" fill="#fff" stroke="#f07a1a" stroke-width="${big?3:2}"/>`;
 if(big||N<=36){for(let k=0;k<N;k++){const a=k/N*2*Math.PI-Math.PI/2,r1=r-(big?10:4);s+=`<line x1="${(c+Math.cos(a)*r1).toFixed(1)}" y1="${(c+Math.sin(a)*r1).toFixed(1)}" x2="${(c+Math.cos(a)*r).toFixed(1)}" y2="${(c+Math.sin(a)*r).toFixed(1)}" stroke="#c9b8a6" stroke-width="1"/>`}}
 s+=`<line class="ind" x1="${c}" y1="${c}" x2="${c}" y2="${c-r+3}" stroke="#22201d" stroke-width="${big?4:3}" stroke-linecap="round" transform="rotate(${seg.pos/N*360} ${c} ${c})"/>`;
 s+=`<text class="lbl" x="${c}" y="${c+(big?44:20)}" text-anchor="middle" font-size="${big?18:10}" fill="#776f66">${seg.pos+1}/${N}</text></svg>`;return s}
function renderQueue(){Q.innerHTML='<div id="head"></div>'+S.rows.map((rw,r)=>`<div class="qrow${rw.mute?' muted':''}">${rw.segs.map((s,i)=>`<div class="blk${r===sel.r&&i===sel.i?' sel':''}" data-r="${r}" data-i="${i}">${wheelSVG(s,false)}<div class="nm">${i+1} ${s.sound}</div></div>`).join('')}</div>`).join('');document.getElementById('addrow').disabled=S.rows.length>=MAXROWS}
function opts(list,cur){return list.map(([v,t])=>`<option value="${v}"${v===cur?' selected':''}>${t}</option>`).join('')}
function renderEd(){fixSel();const rw=S.rows[sel.r],s=rw.segs[sel.i];
 E.innerHTML=`<div class="row"><span class="ttl">Row ${sel.r+1} Block ${sel.i+1}</span>
 <label>Sound <select id="snd">${opts(SOUNDS.map(x=>[x,x]),s.sound)}</select></label>
 <label>Notches <input id="nn" type="number" min="1" max="360" value="${s.notches}"></label></div>
 <div class="row"><button id="mute">${rw.mute?'Unmute row':'Mute row'}</button><button id="delrow"${S.rows.length<2?' disabled':''}>Remove row</button></div>
 <div id="bw">${wheelSVG(s,true)}</div>
 <div class="row" style="justify-content:center"><button id="nb">Notch back</button><button id="nf">Notch forward</button><button id="n0">To notch 1</button></div>
 <div id="lanes">${s.lanes.map((l,i)=>`<div class="lane" data-l="${i}">
 <select data-k="fx">${opts(Object.keys(FX).map(x=>[x,x]),l.fx)}</select>
 <select data-k="mode">${opts(Object.entries(MODES),l.mode)}</select>
 ${l.mode==='list'?`<input class="vals" data-k="vals" placeholder="10,20,30,40" value="${l.vals}">`:`<label>From <input type="number" data-k="from" value="${l.from}"></label><label>To <input type="number" data-k="to" value="${l.to}"></label>`}
 <span class="now"></span><button data-k="del">Remove</button></div>`).join('')}</div>
 <button id="add">Add assignment</button>
 <p class="hint">Each time the red line crosses a block it plays at the current notch, then the wheel turns one notch. A step list cycles its values one per notch. The other shapes spread From to To across all notches. Ratchet repeats the hit up to 16 times inside the span, measured in steps. Accel above 0 squeezes the repeats closer together like a bouncing ball, below 0 spreads them out. Fall lowers each repeat by that percent, and rpitch shifts each repeat by that many semitones. Ranges: echo, tremolo, filter, drive 0 to 100, tremrate 1 to 30 Hz, reso 0 to 30, pitch -24 to 24, volume 0 to 150, pan -100 to 100, decay 10 to 400.</p>`}
function refreshAll(){renderQueue();renderEd();save()}
Q.addEventListener('click',e=>{const b=e.target.closest('.blk');if(b){sel={r:+b.dataset.r,i:+b.dataset.i};renderQueue();renderEd()}});
function cur(){return S.rows[sel.r].segs[sel.i]}
function edit(e){const t=e.target,s=cur();
 if(t.id==='snd'){s.sound=t.value;renderQueue();save();return}
 if(t.id==='nn'){const n=Math.max(1,Math.min(360,parseInt(t.value)||1));s.notches=n;s.pos%=n;document.getElementById('bw').innerHTML=wheelSVG(s,true);renderQueue();save();return}
 const ln=t.closest('.lane');if(!ln)return;const l=s.lanes[+ln.dataset.l],k=t.dataset.k;
 if(k==='fx'||k==='mode'){if(e.type!=='change')return;l[k]=t.value;if(k==='fx'){l.from=FX[l.fx].min;l.to=FX[l.fx].max}renderEd();save()}
 else if(k==='vals'||k==='from'||k==='to'){l[k]=t.value;save()}}
E.addEventListener('input',edit);E.addEventListener('change',edit);
E.addEventListener('click',e=>{const t=e.target,s=cur();
 if(t.id==='add'){s.lanes.push({fx:'echo',mode:'list',vals:'',from:0,to:100});refreshAll()}
 else if(t.id==='nf'){s.pos=(s.pos+1)%s.notches;save()}
 else if(t.id==='nb'){s.pos=(s.pos-1+s.notches)%s.notches;save()}
 else if(t.id==='n0'){s.pos=0;save()}
 else if(t.id==='mute'){S.rows[sel.r].mute=!S.rows[sel.r].mute;refreshAll()}
 else if(t.id==='delrow'){if(S.rows.length>1){S.rows.splice(sel.r,1);fixSel();refreshAll()}}
 else if(t.dataset.k==='del'){s.lanes.splice(+t.closest('.lane').dataset.l,1);refreshAll()}});
document.getElementById('addrow').onclick=()=>{if(S.rows.length<MAXROWS){S.rows.push(row({}));sel={r:S.rows.length-1,i:0};refreshAll()}};
playB.onclick=()=>playing?stop():start();
const bpmI=document.getElementById('bpm'),divI=document.getElementById('div'),preI=document.getElementById('pre');
preI.innerHTML='<option value="">Load...</option>'+Object.keys(PRESETS).map(k=>`<option value="${k}">${k}</option>`).join('');
preI.onchange=()=>{if(!preI.value)return;S=PRESETS[preI.value]();bpmI.value=S.bpm;divI.value=S.div;sel={r:0,i:0};preI.value='';refreshAll()};
function syncHead(){bpmI.value=S.bpm;divI.value=S.div}
syncHead();
bpmI.oninput=()=>{const v=parseInt(bpmI.value);if(v>=40&&v<=300){S.bpm=v;save()}};
divI.onchange=()=>{S.div=+divI.value;save()};
document.getElementById('rst').onclick=()=>{S.rows.forEach(rw=>rw.segs.forEach(s=>s.pos=0));save()};
document.getElementById('clr').onclick=()=>{S.rows=[row({})];sel={r:0,i:0};refreshAll()};
function setWheel(svg,seg){if(!svg)return;const ind=svg.querySelector('.ind'),lbl=svg.querySelector('.lbl'),c=svg.viewBox.baseVal.width/2;ind.setAttribute('transform',`rotate(${seg.pos/seg.notches*360} ${c} ${c})`);lbl.textContent=`${seg.pos+1}/${seg.notches}`}
function frame(){let curI=-1;
 if(playing&&ac){const now=ac.currentTime;while(hits.length>1&&hits[1].t<=now)hits.shift();const h=hits[0];if(h&&h.t<=now){const fr=Math.min(1,(now-h.t)/stepDur());const hd=document.getElementById('head');if(hd)hd.style.left=`calc(${(h.i+fr)/8*100}% - 1px)`;if(now-h.t<.09)curI=h.i}}
 Q.querySelectorAll('.blk').forEach(b=>{const r=+b.dataset.r,i=+b.dataset.i,rw=S.rows[r];if(!rw)return;const s=rw.segs[i];setWheel(b.querySelector('svg'),s);b.classList.toggle('hit',i===curI&&!rw.mute&&s.sound!=='none')});
 const s=cur();setWheel(document.querySelector('#bw svg'),s);
 E.querySelectorAll('.lane').forEach(ln=>{const l=s.lanes[+ln.dataset.l];if(l)ln.querySelector('.now').textContent=`now ${Math.round(laneValue(l,s.pos,s.notches))}${FX[l.fx].u}`});
 requestAnimationFrame(frame)}
renderQueue();renderEd();requestAnimationFrame(frame);
</script>
</body>
</html>
