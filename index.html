<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dial Queue</title>
<style>
:root{--bg:#f7f8fa;--card:#fff;--ink:#1d2330;--mute:#6b7385;--line:#d9dee8;--blue:#0a9be0;--red:#f04848;--purple:#b62fe0;--sel:#e6f5fd}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif}
header{padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid var(--line);background:var(--card)}
h1{font-size:18px;margin:0 8px 0 0}
button{font:inherit;border:1px solid var(--line);background:var(--card);padding:8px 12px;border-radius:8px;color:var(--ink)}
button.go{background:var(--blue);color:#fff;border-color:var(--blue)}
label{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:4px}
input,select{font:inherit;padding:6px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
input[type=number]{width:72px}
main{padding:24px 16px;max-width:900px;margin:0 auto}
#queue{position:relative;display:grid;grid-template-columns:repeat(8,1fr);border:2px solid var(--blue);border-radius:8px;background:var(--card)}
.blk{border-right:1px solid var(--blue);padding:6px 2px;text-align:center;cursor:pointer;min-width:0}
.blk:last-child{border-right:0}
.blk.sel{background:var(--sel)}
.blk.hit{background:#fff4d6}
.blk svg{width:100%;max-width:64px;height:auto;display:block;margin:0 auto}
.blk .nm{font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#head{position:absolute;top:-10px;bottom:-10px;width:3px;background:var(--red);left:0;pointer-events:none;border-radius:2px}
#ed{margin-top:24px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
.ttl{font-weight:600;font-size:16px}
.lane{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lane input.vals{flex:1;min-width:140px}
.lane .now{font-size:12px;color:var(--purple);min-width:64px}
#bw svg{width:220px;max-width:100%;display:block;margin:0 auto 10px}
.hint{font-size:12px;color:var(--mute);line-height:1.5;margin:10px 0 0}
</style>
</head>
<body>
<header>
<h1>Dial Queue</h1>
<button id="play" class="go">Play</button>
<label>BPM <input id="bpm" type="number" min="40" max="300"></label>
<label>Step <select id="div"><option value="1">1/4</option><option value="2">1/8</option><option value="4">1/16</option></select></label>
<button id="rst">Reset wheels</button>
<button id="dem">Demo</button>
<button id="clr">Clear</button>
</header>
<main>
<div id="queue"></div>
<div id="ed"></div>
</main>
<script>
const FX={echo:{min:0,max:100,def:0,u:'%'},tremolo:{min:0,max:100,def:0,u:'%'},tremrate:{min:1,max:30,def:8,u:'Hz'},filter:{min:0,max:100,def:100,u:'%'},reso:{min:0,max:30,def:1,u:'Q'},pitch:{min:-24,max:24,def:0,u:'st'},volume:{min:0,max:150,def:100,u:'%'},pan:{min:-100,max:100,def:0,u:''},drive:{min:0,max:100,def:0,u:'%'},decay:{min:10,max:400,def:100,u:'%'}};
const SOUNDS=['kick','snare','hat','openhat','clap','tom','rim','cowbell','none'];
const MODES={list:'Step list',ramp:'Ramp',tri:'Up and down',sine:'Smooth wave',rand:'Random repeat'};
function blank(s){return{sound:s,notches:1,pos:0,lanes:[]}}
function demo(){const p=['kick','kick','snare','kick','kick','kick','kick','kick'].map(blank);p[0].notches=4;p[0].lanes.push({fx:'echo',mode:'list',vals:'10,20,30,40',from:0,to:100});p[2].notches=8;p[2].lanes.push({fx:'tremolo',mode:'tri',vals:'',from:0,to:80});return{bpm:110,div:2,segs:p}}
let S=null;try{S=JSON.parse(localStorage.getItem('dialqueue1'))}catch(e){}
if(!S||!S.segs||S.segs.length!==8)S=demo();
function save(){try{localStorage.setItem('dialqueue1',JSON.stringify(S))}catch(e){}}
function clamp(v,f){return Math.max(f.min,Math.min(f.max,v))}
function laneValue(l,p,N){const f=FX[l.fx];let v;
 if(l.mode==='list'){const a=String(l.vals).split(/[ ,]+/).filter(x=>x!=='').map(Number).filter(x=>!isNaN(x));v=a.length?a[p%a.length]:f.def}
 else{const from=+l.from||0,to=+l.to||0;let t=0;
  if(l.mode==='ramp')t=N>1?p/(N-1):0;
  else if(l.mode==='tri'){const ph=p/N;t=ph<.5?ph*2:2-ph*2}
  else if(l.mode==='sine')t=.5-.5*Math.cos(2*Math.PI*p/N);
  else if(l.mode==='rand'){let h=((p+1)*2654435761)%4294967296;h=(h^(h>>>15))>>>0;t=(h%1000)/999}
  v=from+(to-from)*t}
 return clamp(v,f)}
function params(seg){const o={};for(const k in FX)o[k]=FX[k].def;for(const l of seg.lanes)o[l.fx]=laneValue(l,seg.pos,seg.notches);return o}

let ac=null,master=null,noise=null;
function initAudio(){if(ac)return;ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.8;const comp=ac.createDynamicsCompressor();master.connect(comp);comp.connect(ac.destination);const len=ac.sampleRate;noise=ac.createBuffer(1,len,ac.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1}
function env(g,t,peak,dec){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+.002);g.gain.exponentialRampToValueAtTime(0.0001,t+Math.max(.01,dec))}
function nz(t,dur){const s=ac.createBufferSource();s.buffer=noise;s.start(t);s.stop(t+dur);return s}
function osc(type,f,t,dur,out){const o=ac.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);o.connect(out);o.start(t);o.stop(t+dur);return o}
function voice(sound,t,P,out){const pm=Math.pow(2,P.pitch/12),dm=P.decay/100,g=ac.createGain();g.connect(out);
 if(sound==='kick'){const o=osc('sine',150*pm,t,.5*dm+.05,g);o.frequency.exponentialRampToValueAtTime(45*pm,t+.12);env(g,t,1,.45*dm)}
 else if(sound==='snare'){const n=nz(t,.3*dm+.05),hp=ac.createBiquadFilter();hp.type='highpass';hp.frequency.value=1200*pm;n.connect(hp);hp.connect(g);env(g,t,.8,.22*dm);const og=ac.createGain();og.connect(out);osc('triangle',185*pm,t,.2,og);env(og,t,.5,.1*dm)}
 else if(sound==='hat'||sound==='openhat'){const n=nz(t,.5*dm+.05),hp=ac.createBiquadFilter();hp.type='highpass';hp.frequency.value=Math.min(16000,7000*pm);n.connect(hp);hp.connect(g);env(g,t,.5,(sound==='hat'?.05:.35)*dm)}
 else if(sound==='clap'){const n=nz(t,.35*dm+.08),bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1500*pm;bp.Q.value=1.5;n.connect(bp);bp.connect(g);g.gain.setValueAtTime(0.0001,t);[0,.012,.024].forEach(x=>{g.gain.setValueAtTime(.9,t+x);g.gain.exponentialRampToValueAtTime(.1,t+x+.01)});g.gain.exponentialRampToValueAtTime(0.0001,t+.04+.2*dm)}
 else if(sound==='tom'){const o=osc('sine',220*pm,t,.4*dm+.05,g);o.frequency.exponentialRampToValueAtTime(110*pm,t+.25);env(g,t,.9,.35*dm)}
 else if(sound==='rim'){const bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1700*pm;bp.connect(g);osc('square',800*pm,t,.06,bp);env(g,t,.7,.04*dm)}
 else if(sound==='cowbell'){const bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=2000*pm;bp.connect(g);osc('square',540*pm,t,.4*dm+.05,bp);osc('square',800*pm,t,.4*dm+.05,bp);env(g,t,.5,.3*dm)}}
function trigger(seg,t){if(seg.sound==='none')return;const P=params(seg);
 const pre=ac.createGain();let node=pre;
 if(P.drive>0){const ws=ac.createWaveShaper(),k=P.drive*2,c=new Float32Array(1024);for(let i=0;i<1024;i++){const x=i/511.5-1;c[i]=(1+k)*x/(1+k*Math.abs(x))}ws.curve=c;node.connect(ws);node=ws}
 const flt=ac.createBiquadFilter();flt.type='lowpass';flt.frequency.value=80*Math.pow(18000/80,P.filter/100);flt.Q.value=P.reso;node.connect(flt);
 const tr=ac.createGain(),dep=P.tremolo/100;tr.gain.value=1-dep/2;flt.connect(tr);
 if(dep>0){const lfo=ac.createOscillator();lfo.frequency.value=P.tremrate;const lg=ac.createGain();lg.gain.value=dep/2;lfo.connect(lg);lg.connect(tr.gain);lfo.start(t);lfo.stop(t+2)}
 const vol=ac.createGain();vol.gain.value=P.volume/100;tr.connect(vol);let last=vol;
 if(ac.createStereoPanner){const pan=ac.createStereoPanner();pan.pan.value=P.pan/100;vol.connect(pan);last=pan}
 last.connect(master);
 if(P.echo>0){const send=ac.createGain();send.gain.value=P.echo/100;const dl=ac.createDelay(4);dl.delayTime.value=.75*60/S.bpm;const fb=ac.createGain();fb.gain.value=.45;last.connect(send);send.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(master);setTimeout(()=>{try{fb.disconnect();dl.disconnect();send.disconnect()}catch(e){}},(t-ac.currentTime)*1000+6000)}
 voice(seg.sound,t,P,pre)}

let playing=false,nextT=0,step=0,timer=null,hits=[];
function stepDur(){return 60/S.bpm/S.div}
function tick(){while(nextT<ac.currentTime+.12){const seg=S.segs[step];trigger(seg,nextT);hits.push({i:step,t:nextT});seg.pos=(seg.pos+1)%seg.notches;nextT+=stepDur();step=(step+1)%8}}
function start(){initAudio();ac.resume();nextT=ac.currentTime+.06;step=0;hits=[];timer=setInterval(tick,25);playing=true;playB.textContent='Stop'}
function stop(){clearInterval(timer);playing=false;playB.textContent='Play';save()}

const Q=document.getElementById('queue'),E=document.getElementById('ed'),playB=document.getElementById('play');
let sel=0;
function wheelSVG(seg,big){const N=seg.notches,size=big?220:64,r=big?96:26,c=size/2;let s=`<svg viewBox="0 0 ${size} ${size}"><circle cx="${c}" cy="${c}" r="${r}" fill="#fff" stroke="#0a9be0" stroke-width="${big?3:2}"/>`;
 if(big||N<=36){for(let k=0;k<N;k++){const a=k/N*2*Math.PI-Math.PI/2,r1=r-(big?10:4);s+=`<line x1="${(c+Math.cos(a)*r1).toFixed(1)}" y1="${(c+Math.sin(a)*r1).toFixed(1)}" x2="${(c+Math.cos(a)*r).toFixed(1)}" y2="${(c+Math.sin(a)*r).toFixed(1)}" stroke="#9aa3b5" stroke-width="1"/>`}}
 s+=`<line class="ind" x1="${c}" y1="${c}" x2="${c}" y2="${c-r+3}" stroke="#f04848" stroke-width="${big?4:3}" stroke-linecap="round" transform="rotate(${seg.pos/N*360} ${c} ${c})"/>`;
 s+=`<text class="lbl" x="${c}" y="${c+(big?44:20)}" text-anchor="middle" font-size="${big?18:10}" fill="#6b7385">${seg.pos+1}/${N}</text></svg>`;return s}
function renderQueue(){Q.innerHTML='<div id="head"></div>'+S.segs.map((s,i)=>`<div class="blk${i===sel?' sel':''}" data-i="${i}">${wheelSVG(s,false)}<div class="nm">${i+1} ${s.sound}</div></div>`).join('')}
function opts(list,cur){return list.map(([v,t])=>`<option value="${v}"${v===cur?' selected':''}>${t}</option>`).join('')}
function renderEd(){const s=S.segs[sel];
 E.innerHTML=`<div class="row"><span class="ttl">Block ${sel+1}</span>
 <label>Sound <select id="snd">${opts(SOUNDS.map(x=>[x,x]),s.sound)}</select></label>
 <label>Notches <input id="nn" type="number" min="1" max="360" value="${s.notches}"></label></div>
 <div id="bw">${wheelSVG(s,true)}</div>
 <div class="row" style="justify-content:center"><button id="nb">Notch back</button><button id="nf">Notch forward</button><button id="n0">To notch 1</button></div>
 <div id="lanes">${s.lanes.map((l,i)=>`<div class="lane" data-l="${i}">
 <select data-k="fx">${opts(Object.keys(FX).map(x=>[x,x]),l.fx)}</select>
 <select data-k="mode">${opts(Object.entries(MODES),l.mode)}</select>
 ${l.mode==='list'?`<input class="vals" data-k="vals" placeholder="10,20,30,40" value="${l.vals}">`:`<label>From <input type="number" data-k="from" value="${l.from}"></label><label>To <input type="number" data-k="to" value="${l.to}"></label>`}
 <span class="now"></span><button data-k="del">Remove</button></div>`).join('')}</div>
 <button id="add">Add assignment</button>
 <p class="hint">Each time the red line crosses this block it plays at the current notch, then the wheel turns one notch. A step list cycles its values one per notch. The other shapes spread From to To across all notches. Ranges: echo, tremolo, filter, drive 0 to 100, tremrate 1 to 30 Hz, reso 0 to 30, pitch -24 to 24 semitones, volume 0 to 150, pan -100 to 100, decay 10 to 400.</p>`}
function refreshAll(){renderQueue();renderEd();save()}
Q.addEventListener('click',e=>{const b=e.target.closest('.blk');if(b){sel=+b.dataset.i;renderQueue();renderEd()}});
function edit(e){const t=e.target,s=S.segs[sel];
 if(t.id==='snd'){s.sound=t.value;renderQueue();save();return}
 if(t.id==='nn'){const n=Math.max(1,Math.min(360,parseInt(t.value)||1));s.notches=n;s.pos%=n;document.getElementById('bw').innerHTML=wheelSVG(s,true);renderQueue();save();return}
 const ln=t.closest('.lane');if(!ln)return;const l=s.lanes[+ln.dataset.l],k=t.dataset.k;
 if(k==='fx'||k==='mode'){if(e.type!=='change')return;l[k]=t.value;if(k==='fx'){l.from=FX[l.fx].min;l.to=FX[l.fx].max}renderEd();save()}
 else if(k==='vals'||k==='from'||k==='to'){l[k]=t.value;save()}}
E.addEventListener('input',edit);E.addEventListener('change',edit);
E.addEventListener('click',e=>{const t=e.target,s=S.segs[sel];
 if(t.id==='add'){s.lanes.push({fx:'echo',mode:'list',vals:'',from:0,to:100});refreshAll()}
 else if(t.id==='nf'){s.pos=(s.pos+1)%s.notches;save()}
 else if(t.id==='nb'){s.pos=(s.pos-1+s.notches)%s.notches;save()}
 else if(t.id==='n0'){s.pos=0;save()}
 else if(t.dataset.k==='del'){s.lanes.splice(+t.closest('.lane').dataset.l,1);refreshAll()}});
playB.onclick=()=>playing?stop():start();
const bpmI=document.getElementById('bpm'),divI=document.getElementById('div');
bpmI.value=S.bpm;divI.value=S.div;
bpmI.oninput=()=>{const v=parseInt(bpmI.value);if(v>=40&&v<=300){S.bpm=v;save()}};
divI.onchange=()=>{S.div=+divI.value;save()};
document.getElementById('rst').onclick=()=>{S.segs.forEach(s=>s.pos=0);save()};
document.getElementById('dem').onclick=()=>{S=demo();bpmI.value=S.bpm;divI.value=S.div;sel=0;refreshAll()};
document.getElementById('clr').onclick=()=>{S.segs=S.segs.map(()=>blank('none'));sel=0;refreshAll()};
function setWheel(svg,seg){if(!svg)return;const ind=svg.querySelector('.ind'),lbl=svg.querySelector('.lbl'),c=svg.viewBox.baseVal.width/2;ind.setAttribute('transform',`rotate(${seg.pos/seg.notches*360} ${c} ${c})`);lbl.textContent=`${seg.pos+1}/${seg.notches}`}
function frame(){const blks=Q.querySelectorAll('.blk');let cur=-1;
 if(playing&&ac){const now=ac.currentTime;while(hits.length>1&&hits[1].t<=now)hits.shift();const h=hits[0];if(h&&h.t<=now){const fr=Math.min(1,(now-h.t)/stepDur());const hd=document.getElementById('head');if(hd)hd.style.left=`calc(${(h.i+fr)/8*100}% - 1px)`;if(now-h.t<.09)cur=h.i}}
 blks.forEach((b,i)=>{setWheel(b.querySelector('svg'),S.segs[i]);b.classList.toggle('hit',i===cur)});
 const s=S.segs[sel];setWheel(document.querySelector('#bw svg'),s);
 E.querySelectorAll('.lane').forEach(ln=>{const l=s.lanes[+ln.dataset.l];if(l)ln.querySelector('.now').textContent=`now ${Math.round(laneValue(l,s.pos,s.notches))}${FX[l.fx].u}`});
 requestAnimationFrame(frame)}
renderQueue();renderEd();requestAnimationFrame(frame);
</script>
</body>
</html>
